name: Release

on:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  GH_REPO: ${{ github.repository }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      cli_publish: ${{ steps.release.outputs.cli_publish }}
      gui_publish: ${{ steps.release.outputs.gui_publish }}
    steps:
      - uses: actions/checkout@v4
      - name: Read crate version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/steam-press-core/Cargo.toml | head -1)
          if [ -z "$version" ]; then
            echo "version not found in crates/steam-press-core/Cargo.toml" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Check existing releases
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.value }}"
          if gh release view "cli-v${version}" >/dev/null 2>&1; then
            echo "cli_publish=false" >> "$GITHUB_OUTPUT"
            echo "cli-v${version} is already published."
          else
            echo "cli_publish=true" >> "$GITHUB_OUTPUT"
          fi
          if gh release view "gui-v${version}" >/dev/null 2>&1; then
            echo "gui_publish=false" >> "$GITHUB_OUTPUT"
            echo "gui-v${version} is already published."
          else
            echo "gui_publish=true" >> "$GITHUB_OUTPUT"
          fi

  linux-cli:
    needs: prepare
    if: needs.prepare.outputs.cli_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Build CLI
        run: cargo build --release --locked -p steam-press-cli
      - name: Package CLI
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          name="steam-press-cli-${VERSION}-linux-x86_64"
          mkdir -p "dist/${name}/docs"
          cp target/release/steam-press "dist/${name}/"
          cp README.md "dist/${name}/"
          cp docs/usage.md "dist/${name}/docs/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")
      - name: Publish CLI release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          name="steam-press-cli-${version}-linux-x86_64"
          gh release create "cli-v${version}" \
            "dist/${name}.tar.gz" \
            "dist/${name}.tar.gz.sha256" \
            --title "Steam Press CLI v${version}" \
            --generate-notes

  linux-gui:
    needs: prepare
    if: needs.prepare.outputs.gui_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Build GUI
        run: cargo build --release --locked -p steam-press-gui
      - name: Package GUI
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          name="steam-press-gui-${VERSION}-linux-x86_64"
          mkdir -p "dist/${name}/docs"
          cp target/release/steam-press-gui "dist/${name}/"
          cp README.md "dist/${name}/"
          cp docs/usage.md "dist/${name}/docs/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")
      - name: Publish GUI release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          name="steam-press-gui-${version}-linux-x86_64"
          gh release create "gui-v${version}" \
            "dist/${name}.tar.gz" \
            "dist/${name}.tar.gz.sha256" \
            --title "Steam Press GUI v${version}" \
            --generate-notes
