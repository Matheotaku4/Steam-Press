name: Release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  GH_REPO: ${{ github.repository }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - name: Restrict manual runs to main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::manual releases must run from main"
          exit 1
      - name: Read crate version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/steam-press-core/Cargo.toml | head -1)
          if [ -z "$version" ]; then
            echo "version not found in crates/steam-press-core/Cargo.toml" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Check existing release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.value }}"
          if gh release view "v${version}" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "v${version} is already published."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os != 'ubuntu-22.04' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
            exe_suffix: ""
          - os: macos-15-intel
            platform: macos-x86_64
            exe_suffix: ""
          - os: macos-15
            platform: macos-aarch64
            exe_suffix: ""
          - os: windows-latest
            platform: windows-x86_64
            exe_suffix: ".exe"
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Build CLI and GUI
        run: cargo build --release --locked -p steam-press-cli -p steam-press-gui
      - name: Package
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          EXE_SUFFIX: ${{ matrix.exe_suffix }}
        run: |
          set -euo pipefail
          version="${VERSION}"
          platform="${PLATFORM}"
          suffix="${EXE_SUFFIX}"
          mkdir -p dist

          combined="steam-press-${version}-${platform}"
          mkdir -p "dist/${combined}/docs"
          cp "target/release/steam-press${suffix}" "dist/${combined}/"
          cp "target/release/steam-press-gui${suffix}" "dist/${combined}/"
          cp README.md LICENSE CHANGELOG.md "dist/${combined}/"
          cp docs/usage.md docs/migration-1.0.md docs/security-review.md \
            docs/exit-codes.md docs/json-schema.md docs/real-test-1.0.1.md \
            "dist/${combined}/docs/"
          cp -R docs/screenshots "dist/${combined}/docs/"
          tar -C dist -czf "dist/${combined}.tar.gz" "${combined}"

          cli="steam-press-cli-${version}-${platform}"
          mkdir -p "dist/${cli}/docs"
          cp "target/release/steam-press${suffix}" "dist/${cli}/"
          cp README.md LICENSE CHANGELOG.md "dist/${cli}/"
          cp docs/usage.md docs/migration-1.0.md docs/security-review.md \
            docs/exit-codes.md docs/json-schema.md docs/real-test-1.0.1.md \
            "dist/${cli}/docs/"
          cp -R docs/screenshots "dist/${cli}/docs/"
          tar -C dist -czf "dist/${cli}.tar.gz" "${cli}"

          gui="steam-press-gui-${version}-${platform}"
          mkdir -p "dist/${gui}/docs"
          cp "target/release/steam-press-gui${suffix}" "dist/${gui}/"
          cp README.md LICENSE CHANGELOG.md "dist/${gui}/"
          cp docs/usage.md docs/migration-1.0.md docs/security-review.md \
            docs/exit-codes.md docs/json-schema.md docs/real-test-1.0.1.md \
            "dist/${gui}/docs/"
          cp -R docs/screenshots "dist/${gui}/docs/"
          tar -C dist -czf "dist/${gui}.tar.gz" "${gui}"

          checksum() {
            name="$(basename "$1")"
            cd dist
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$name" > "$name.sha256"
            else
              shasum -a 256 "$name" > "$name.sha256"
            fi
            cd ..
          }
          checksum "dist/${combined}.tar.gz"
          checksum "dist/${cli}.tar.gz"
          checksum "dist/${gui}.tar.gz"
      - name: Upload platform archives
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: dist/*.tar.gz*
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    if: always() && needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Require the Linux archives
        run: |
          set -euo pipefail
          ls dist/steam-press-*-linux-x86_64.tar.gz >/dev/null
      - name: Build SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./*.tar.gz > SHA256SUMS
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          tag="v${version}"
          target=()
          if git rev-parse --verify "refs/tags/${tag}" >/dev/null 2>&1; then
            tag_commit=$(git rev-list -n 1 "${tag}")
            if [ "${tag_commit}" != "${{ github.sha }}" ]; then
              echo "::error::${tag} points to ${tag_commit}, not ${{ github.sha }}"
              exit 1
            fi
          else
            target=(--target "${{ github.sha }}")
          fi
          gh release create "${tag}" \
            dist/*.tar.gz \
            dist/*.tar.gz.sha256 \
            dist/SHA256SUMS \
            --title "Steam Press v${version}" \
            --generate-notes \
            "${target[@]}"
