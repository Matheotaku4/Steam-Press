name: Release

on:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  GH_REPO: ${{ github.repository }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - name: Read crate version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/steam-press-core/Cargo.toml | head -1)
          if [ -z "$version" ]; then
            echo "version not found in crates/steam-press-core/Cargo.toml" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Check existing release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.value }}"
          if gh release view "v${version}" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "v${version} is already published."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  linux-x86_64:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Build CLIs and GUI
        run: cargo build --release --locked -p steam-press-cli -p steam-press-gui
      - name: Package
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          version="${VERSION}"
          mkdir -p dist

          combined="steam-press-${version}-linux-x86_64"
          mkdir -p "dist/${combined}/docs"
          cp target/release/steam-press target/release/steam-press-gui "dist/${combined}/"
          cp README.md "dist/${combined}/"
          cp docs/usage.md "dist/${combined}/docs/"
          tar -C dist -czf "dist/${combined}.tar.gz" "${combined}"

          cli="steam-press-cli-${version}-linux-x86_64"
          mkdir -p "dist/${cli}/docs"
          cp target/release/steam-press "dist/${cli}/"
          cp README.md "dist/${cli}/"
          cp docs/usage.md "dist/${cli}/docs/"
          tar -C dist -czf "dist/${cli}.tar.gz" "${cli}"

          gui="steam-press-gui-${version}-linux-x86_64"
          mkdir -p "dist/${gui}/docs"
          cp target/release/steam-press-gui "dist/${gui}/"
          cp README.md "dist/${gui}/"
          cp docs/usage.md "dist/${gui}/docs/"
          tar -C dist -czf "dist/${gui}.tar.gz" "${gui}"

          (cd dist && sha256sum "${combined}.tar.gz" > "${combined}.tar.gz.sha256" \
            && sha256sum "${cli}.tar.gz" > "${cli}.tar.gz.sha256" \
            && sha256sum "${gui}.tar.gz" > "${gui}.tar.gz.sha256" \
            && sha256sum ./*.tar.gz > SHA256SUMS)
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          gh release create "v${version}" \
            dist/*.tar.gz \
            dist/*.tar.gz.sha256 \
            dist/SHA256SUMS \
            --title "Steam Press v${version}" \
            --generate-notes
