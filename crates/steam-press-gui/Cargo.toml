[package]
name = "steam-press-gui"
version = "1.0.1"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Desktop interface for Steam Press"

[[bin]]
name = "steam-press-gui"
path = "src/main.rs"

[dependencies]
steam-press-core = { version = "1.0.1", path = "../steam-press-core" }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
