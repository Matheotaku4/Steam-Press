[package]
name = "steam-press-cli"
version = "0.6.1"
edition = "2021"
license = "MIT"
description = "Command-line interface for Steam Press"

[[bin]]
name = "steam-press"
path = "src/main.rs"

[dependencies]
steam-press-core = { path = "../steam-press-core" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
rpassword = "7"
