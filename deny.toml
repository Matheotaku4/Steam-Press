[graph]
all-features = true

[advisories]
version = 2
unmaintained = "workspace"
ignore = [
  # chrono 0.4.45 is the latest release; RUSTSEC-2026-0543 has no fixed
  # version. Migration to `time` is tracked separately from the 1.0.3 release.
  { id = "RUSTSEC-2026-0543", reason = "no fixed chrono release exists yet" },
]

[licenses]
version = 2
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "OFL-1.1",
  "OpenSSL",
  "Ubuntu-font-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
